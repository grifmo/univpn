name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :univpn:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :univpn:testDebugUnitTest

      - uses: actions/upload-artifact@v5
        with:
          name: univpn-debug-apk
          path: univpn/build/outputs/apk/debug/*.apk
          if-no-files-found: error
