name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1 for a pre-release) to publish a signed APK.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # SHA-256 of the release signing certificate (also listed in README.md).
  # The workflow refuses to publish an APK signed with anything else.
  EXPECTED_CERT_SHA256: 603b111639bc9388c2ebac2b4d6b4cbb1e8fe7861d6ce478c30c057d156d525d

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew :univpn:assembleRelease :univpn:bundleRelease "-PreleaseVersion=${GITHUB_REF_NAME}" --stacktrace

      - name: Verify signature and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=univpn/build/outputs/apk/release/univpn-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner

          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with unexpected certificate: $ACTUAL"
            exit 1
          fi

          mkdir dist
          cp "$APK" "dist/univpn-$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "UniVPN ${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag $PRERELEASE

      # Uploads the AAB (signed with the upload key) to the Play internal testing track.
      # The very first AAB for a new app must be uploaded by hand in Play Console.
      # Set the repo variable PLAY_RELEASE_STATUS=draft while the app is still in draft state.
      - name: Check for Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload to Google Play (internal testing)
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.univpn.app
          releaseFiles: univpn/build/outputs/bundle/release/univpn-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
